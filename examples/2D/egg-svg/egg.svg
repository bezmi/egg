  The egg-in-rectangle domain, drawn for import by egg_svg.py (svg_import).
  Each boundary is a separate object whose Inkscape label names it: inflow
  (left wall), outflow (right wall), wall_top / wall_bottom, and the closed
  egg curve. The paths are authored in the direction the topology expects
  (bottom west->east, right south->north, top east->west, left south->north
  in model space); editing the shapes in Inkscape is fine as long as the
  labels and directions survive.
-->
